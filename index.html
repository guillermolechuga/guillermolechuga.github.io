<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guillermo Lechuga</title>
  <meta name="description" content="Apps by Guillermo Lechuga, independent iOS and Android developer.">
  <style>
    :root { color-scheme: light dark; --bg: #fafaf8; --fg: #1c1c1e; --muted: #6e6e73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f2f2f7; --muted: #98989d; } }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 4rem 1rem; }
    h1 { font-size: 1.75rem; margin: 0 0 .25rem; }
    p { color: var(--muted); margin: 0 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: .6rem 0; border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
  </style>
</head>
<body>
  <main>
    <h1>Guillermo Lechuga</h1>
    <p>Independent iOS and Android developer.</p>
    <ul>
      <li>Alchemy: Merge Tower Defense</li>
      <li>From 1 to 10: Trivia Game</li>
      <li>Guess What: Charades Party</li>
      <li>Mind Gauge: Guess the Spectrum</li>
      <li>Jam Mate: AI Backing Tracks</li>
      <li>CAP y Competencia Profesional</li>
      <li>Licencia de Armas: ArmasTest</li>
    </ul>
  </main>
</body>
</html>
