<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Guillermo Lechuga</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafaf8; --fg: #1c1c1e; --muted: #6e6e73; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f2f2f7; --muted: #98989d; } }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
    nav a, a { color: inherit; }
    nav { color: var(--muted); font-size: .9rem; margin-bottom: 2rem; }
    h1 { font-size: 1.75rem; margin: 0 0 1.5rem; }
    h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; }
    em { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">Guillermo Lechuga</a> / <a href="/legal/">Legal</a></nav>
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
</body>
</html>
