<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Guillermo Lechuga</title>
  <meta name="description" content="{{ page.description }}">
  <style>
    :root { color-scheme: light dark; --bg: #fafaf8; --fg: #1c1c1e; --muted: #6e6e73; --line: rgba(110,110,115,.3); }
    @media (prefers-color-scheme: dark) { :root { --bg: #111113; --fg: #f2f2f7; --muted: #98989d; } }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 52rem; margin: 0 auto; padding: 3rem 1rem 4rem; }
    a { color: inherit; }
    nav { color: var(--muted); font-size: .9rem; margin-bottom: 2rem; }
    h1 { font-size: 2rem; margin: 0 0 1rem; }
    h2 { font-size: 1.5rem; margin: 0 0 .25rem; display: flex; align-items: center; gap: .75rem; }
    h2 img { width: 64px; height: 64px; border-radius: 14px; }
    h3 { font-size: 1rem; margin: 1.5rem 0 .25rem; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 3rem 0; }
    em { color: var(--muted); }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; margin: 1rem 0; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; white-space: nowrap; }
    .shots { display: flex; gap: .75rem; overflow-x: auto; padding: .5rem 0 1rem; }
    .shots img { height: 380px; width: auto; border-radius: 14px; border: 1px solid var(--line); flex: none; }
    .stores { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: 1rem 0; }
    .stores img { height: 44px; width: auto; display: block; }
    .badge.soon { position: relative; opacity: .55; }
    .badge.soon::after { content: "Coming soon"; position: absolute; left: 0; right: 0; bottom: -1.2rem; text-align: center; font-size: .7rem; color: var(--muted); }
    .soon-text { font-size: .85rem; color: var(--muted); }
    .stores { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <nav><a href="/">Guillermo Lechuga</a> / Portfolio</nav>
    {{ content }}
  </main>
</body>
</html>
